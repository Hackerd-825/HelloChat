<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>HelloChat</title>
<style>
*{box-sizing:border-box;font-family:"Segoe UI",Arial,sans-serif}
body{
  margin:0;height:100vh;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display:flex;justify-content:center;align-items:center
}
#chat-container{
  width:380px;height:600px;background:#111;border-radius:15px;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 0 30px rgba(0,0,0,.6)
}
#chat-header{
  padding:15px;background:#1f1f1f;text-align:center;
  font-size:20px;font-weight:bold;color:#4cafef
}
#messages{
  flex:1;padding:15px;overflow-y:auto;background:#0b0b0b
}
.message{
  margin-bottom:10px;padding:10px 12px;border-radius:10px;
  max-width:80%;word-wrap:break-word;
  animation:fadeIn .2s ease
}
.message.user{
  background:#4cafef;color:#000;margin-left:auto;text-align:right
}
.message.other{
  background:#2a2a2a;color:#fff;margin-right:auto
}
#chat-input{
  display:flex;padding:10px;background:#1a1a1a
}
#chat-input input{
  flex:1;padding:10px;border:none;border-radius:8px;
  outline:none;background:#2a2a2a;color:#fff
}
#chat-input button{
  margin-left:10px;padding:10px 16px;border:none;border-radius:8px;
  background:#4cafef;color:#000;cursor:pointer;font-weight:bold
}
#chat-input button:hover{background:#6cc6ff}

#login{
  position:absolute;inset:0;background:rgba(0,0,0,.9);
  display:flex;justify-content:center;align-items:center
}
#login-box{
  background:#1a1a1a;padding:25px;border-radius:12px;
  text-align:center;width:280px
}
#login-box h2{margin-bottom:15px;color:#4cafef}
#login-box input{
  width:100%;padding:10px;border:none;border-radius:8px;
  margin-bottom:10px;background:#2a2a2a;color:#fff
}
#login-box button{
  width:100%;padding:10px;border:none;border-radius:8px;
  background:#4cafef;color:#000;font-weight:bold;cursor:pointer
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<div id="chat-container">
  <div id="chat-header">💬 HelloChat</div>
  <div id="messages"></div>
  <div id="chat-input">
    <input id="message" placeholder="Écris un message..." autocomplete="off">
    <button onclick="sendMessage()">Envoyer</button>
  </div>
</div>

<div id="login">
  <div id="login-box">
    <h2>Connexion</h2>
    <input id="usernameInput" placeholder="Ton pseudo">
    <button onclick="login()">Entrer</button>
  </div>
</div>

<script>
let username = localStorage.getItem("username") || "";
let lastId = 0;
const seen = new Set();

const messages = document.getElementById('messages');
const messageInput = document.getElementById('message');
const loginDiv = document.getElementById('login');
const usernameInput = document.getElementById('usernameInput');

// Si déjà connecté avant, on cache le login
if (username !== "") {
  loginDiv.style.display = "none";
}

function login() {
  const u = usernameInput.value.trim();
  if (u !== "") {
    username = u;
    localStorage.setItem("username", username);
    loginDiv.style.display = "none";
    // Réaffiche l'historique avec le bon "Moi"
    messages.innerHTML = "";
    seen.clear();
    lastId = 0;
    poll();
  }
}

function addMessage(text, type) {
  const div = document.createElement('div');
  div.className = 'message ' + type;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function render(data) {
  if (seen.has(data.id)) return;
  seen.add(data.id);
  lastId = Math.max(lastId, data.id);
  if (data.user === username) {
    addMessage("Moi : " + data.text, "user");
  } else {
    addMessage(data.user + " : " + data.text, "other");
  }
}

// 🔄 Récupération des nouveaux messages (polling HTTP, compatible Vercel)
let polling = false;
async function poll() {
  if (polling) return;
  polling = true;
  try {
    const res = await fetch('/api/messages?after=' + lastId, {cache: 'no-store'});
    if (res.ok) (await res.json()).forEach(render);
  } catch (e) {}
  polling = false;
}
setInterval(() => { if (!document.hidden) poll(); }, 2000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
poll();

// 📤 Envoi d'un message
async function sendMessage() {
  const msg = messageInput.value.trim();
  if (msg === "" || username === "") return;
  messageInput.value = "";
  try {
    const res = await fetch('/api/messages', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user: username, text: msg})
    });
    if (res.ok) render(await res.json());
  } catch (e) {
    messageInput.value = msg;
  }
}

// ⏎ Touche Entrée
messageInput.addEventListener("keypress", e => {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
